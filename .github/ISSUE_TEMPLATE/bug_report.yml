name: Bug report
description: Something in one of the tools doesn't work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste an API key, or a screenshot showing one, anywhere in
        this issue. Found a security problem? See
        [SECURITY.md](https://github.com/karmalab-tech/karmalab-tools/blob/main/SECURITY.md)
        instead of filing here.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options:
        - Batch Image Studio (/)
        - Continuous Video Studio (/video-chain)
        - The Node server or the Replicate proxy
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Replicate model
      description: The model selected when it went wrong, if relevant.
      placeholder: black-forest-labs/flux-1.1-pro
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: >
        Any error shown in the UI, plus anything in the browser console or the
        server output. Redact your API key if it appears.
      render: text
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: how-running
    attributes:
      label: How were you running it
      options:
        - yarn dev
        - yarn build + yarn start
        - A deployed instance
    validations:
      required: true

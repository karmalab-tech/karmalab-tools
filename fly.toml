# fly.io configuration for KarmaLab Tools.
#
# Deploys automatically via .github/workflows/deploy.yml on push to main,
# using a deploy token stored as the FLY_API_TOKEN repo secret. The `app`
# name itself isn't set here — the workflow passes it via `flyctl deploy
# --app`, sourced from the FLY_APP_NAME repo secret, so it doesn't appear in
# repo code. To deploy locally, pass it yourself: `fly deploy --app <name>`.
#
# A fork needs its own fly.io app: run `fly apps create`, then set its own
# FLY_API_TOKEN (`fly tokens create deploy`) and FLY_APP_NAME secrets.
#
# See https://fly.io/docs/reference/configuration/ for the full reference.
#

primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

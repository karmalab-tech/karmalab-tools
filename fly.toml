# fly.toml app configuration file generated for tools-9dc2aw on 2026-07-06T12:11:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tools-9dc2aw'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

# fly.io configuration for KarmaLab Tools.
#
# Deploys automatically via .github/workflows/deploy.yml on push to main,
# using a deploy token stored as the FLY_API_TOKEN repo secret. A fork needs
# its own fly.io app: change `app` below, run `fly apps create`, and set its
# own FLY_API_TOKEN secret (`fly tokens create deploy`) to deploy under this
# workflow.
#
# See https://fly.io/docs/reference/configuration/ for the full reference.
#

app = 'karmalab-tools'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

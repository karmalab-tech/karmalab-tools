# fly.io configuration for KarmaLab Tools.
#
# `app` below is a placeholder: app names are globally unique on fly.io, so this
# file cannot name a real app that a fork could deploy to. Run `fly launch` once
# to create your own app and have it rewrite this line, or set the name yourself
# and deploy with `fly deploy`.
#
# See https://fly.io/docs/reference/configuration/ for the full reference.
# 

app = 'karmalab-tools'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

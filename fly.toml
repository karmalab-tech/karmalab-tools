# fly.io configuration for KarmaLab Tools
#
# First-time setup:
#   fly launch --no-deploy   # (or `fly apps create karmalab-tools`)
#   fly deploy
#
# Update the app name below to whatever you register on fly.io.

app = "karmalab-tools"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
